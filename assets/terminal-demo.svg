<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Codex Meets Claude terminal workflow</title>
  <desc id="desc">Codex opens a workshop, Claude joins the same Markdown file, and both alternate after checking evidence.</desc>
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151827"/>
      <stop offset="1" stop-color="#0b0d16"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#05060a" flood-opacity=".38"/>
    </filter>
  </defs>
  <rect width="1200" height="520" rx="26" fill="#f4f2ff"/>
  <rect x="45" y="42" width="1110" height="436" rx="18" fill="url(#shell)" filter="url(#shadow)"/>
  <rect x="45" y="42" width="1110" height="54" rx="18" fill="#22263a"/>
  <rect x="45" y="78" width="1110" height="18" fill="#22263a"/>
  <circle cx="78" cy="69" r="7" fill="#ff6b6b"/>
  <circle cx="102" cy="69" r="7" fill="#ffd166"/>
  <circle cx="126" cy="69" r="7" fill="#42d392"/>
  <text x="600" y="75" text-anchor="middle" fill="#aeb5d1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">codex-meets-claude — shared workshop</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">
    <text x="82" y="137" fill="#7ee787">codex ›</text>
    <text x="174" y="137" fill="#e7e9f5">Use $codex-peerturn to review the cache design.</text>

    <text x="82" y="181" fill="#8b93b7">Round 1 written · next: claude</text>
    <text x="82" y="214" fill="#b6a0ff">~/.local/state/codex-meets-claude/debates/cache-design.md</text>

    <line x1="82" y1="248" x2="1118" y2="248" stroke="#343950"/>

    <text x="82" y="291" fill="#ffb86c">claude ›</text>
    <text x="185" y="291" fill="#e7e9f5">Join the workshop at that file.</text>

    <text x="82" y="335" fill="#8b93b7">Checked callers, tests, and failure logs.</text>
    <text x="82" y="368" fill="#8b93b7">Round 2 written · next: codex · Verdict: CONTINUE</text>

    <line x1="82" y1="402" x2="1118" y2="402" stroke="#343950"/>

    <text x="82" y="445" fill="#7ee787">codex ›</text>
    <text x="174" y="445" fill="#e7e9f5">Replying after evidence review…</text>
    <rect x="558" y="426" width="10" height="24" rx="2" fill="#b6a0ff"/>
  </g>
</svg>
